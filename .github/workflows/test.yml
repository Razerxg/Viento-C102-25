name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm ci || npm install
      # El lint va PRIMERO y es el más barato de los tres: un identificador sin
      # importar rompe la pantalla en runtime, y ni el typecheck ni los tests de
      # motor lo ven.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # El build se corre acá TAMBIÉN, y no sólo en Vercel: si el bundle deja de
      # compilar, se entera el PR y no el deploy. `build` ya arranca por `npm test`,
      # así que esto verifica de paso que esa cadena no se rompió.
      - run: npm run build
